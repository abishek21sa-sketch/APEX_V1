# One-command local startup for all three tiers. Verified: `docker compose up
# --build` builds all three images and serves a working app end to end
# (mission builder, Pareto search, single-candidate evaluate, and the agent
# chat panel all confirmed live through the containers in a real browser).
#
#   docker compose up --build
#
# Then open http://localhost:3000. Set ANTHROPIC_API_KEY in the environment
# (or a .env file docker compose reads automatically) before starting if you
# want /agent/chat (Phase 9) to actually work -- it degrades to a clear error
# instead of crashing if unset, per service/main.py's design.

services:
  scientific-service:
    build:
      context: .
      dockerfile: service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APEX_PYTHON_SERVICE_URL: http://scientific-service:8001
      APEX_BACKEND_PORT: "8080"
    depends_on:
      - scientific-service
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - backend
    restart: unless-stopped
