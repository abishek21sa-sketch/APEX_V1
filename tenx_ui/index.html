y evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Aero & Energy evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Mass & Packaging","engineering_question":"What does Mass & Packaging show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Component mass roll-up, payload allowance and packaging feasibility constraints","evidence":"Evidence object: Component mass roll-up, payload allowance and packaging feasibility constraints; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable mass & packaging evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Mass & Packaging evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Thermal Envelope","engineering_question":"What does Thermal Envelope show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Thermal/power derating envelope under ambient and sustained-load scenarios","evidence":"Evidence object: Thermal/power derating envelope under ambient and sustained-load scenarios; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable thermal envelope evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Thermal Envelope evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Performance","engineering_question":"What does Performance show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Physics-derived acceleration, range and energy-efficiency KPI evaluation","evidence":"Evidence object: Physics-derived acceleration, range and energy-efficiency KPI evaluation; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable performance evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Performance evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Trade Space","engineering_question":"What does Trade Space show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Mixed-variable candidate generation with feasibility screening before expensive simulation","evidence":"Evidence object: Mixed-variable candidate generation with feasibility screening before expensive simulation; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable trade space evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Trade Space evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Pareto Frontier","engineering_question":"What does Pareto Frontier show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Multi-objective Pareto search over cost, range, acceleration and efficiency","ev e responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Manufacturability","engineering_question":"What does Manufacturability show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Manufacturing-cost decomposition, architecture complexity and production feasibility review","evidence":"Evidence object: Manufacturing-cost decomposition, architecture complexity and production feasibility review; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable manufacturability evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Manufacturability evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"AI Design Council","engineering_question":"What does AI Design Council show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Multi-role analytical orchestration across physics, ML, robustness and ARCH-SHIELD","evidence":"Evidence object: Multi-role analytical orchestration across physics, ML, robustness and ARCH-SHIELD; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable ai design council evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the AI Design Council evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Validation","engineering_question":"What does Validation show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Holdout prediction metrics, physics invariants, robust-feasibility and regression gates","evidence":"Evidence object: Holdout prediction metrics, physics invariants, robust-feasibility and regression gates; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable validation evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Validation evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Research Evidence","engineering_question":"What does Research Evidence show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Ablation, baseline comparison, uncertainty, stress and claim-boundary ledger","evidence":"Evidence object: Ablation, baseline comparison, uncertainty, stress and claim-boundary ledger; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable research evidence evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Research Evidence evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Release Review","engineering_question":"What does Release Review show that would change the architecture release / HOLD for the current vehicle architecture scope?","method":"Human engineering release gate with evidence fingerprint and autonomous-release block","evidence":"Evidence object: Human engineering release gate with evidence fingerprint and autonomous-release block; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable release review evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Release Review evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Data Backbone","engineering_question":"Can the vehicle architecture / requirement release decision be traced to a reproducible external source rather than only a demo fixture?","method":"EPA source contract, schema/cache profile and empirical-vs-reference provenance state","evidence":"Evidence object: EPA source contract, schema/cache profile and empirical-vs-reference provenance state, with explicit external/reference data mode and claim boundary.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable data backbone evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Data Backbone evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Historical Intelligence","engineering_question":"How has technology, mass, efficiency and electrification trade-space trends changed across cohorts, runs or states?","method":"Model-year / candidate-history comparison of efficiency, cost and robust-feasibility evidence","evidence":"Evidence object: Model-year / candidate-history comparison of efficiency, cost and robust-feasibility evidence, with explicit external/reference data mode and claim boundary.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable historical intelligence evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Historical Intelligence evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Entity / Factor Explorer","engineering_question":"Which vehicle / architecture / requirement / uncertainty scenario carries the highest evidence concentration?","method":"Architecture/KPI ranking by confidence shortfall, cost premium and sensitivity contribution","evidence":"Evidence object: Architecture/KPI ranking by confidence shortfall, cost premium and sensitivity contribution, with explicit external/reference data mode and claim boundary.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable entity / factor explorer evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Entity / Factor Explorer evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Empirical Case Study","engineering_question":"Which candidate architecture closes the largest gap to empirical vehicle benchmarks?","method":"MY2024 technology benchmark interpreted against the modeled architecture frontier","evidence":"Evidence object: MY2024 technology benchmark interpreted against the modeled architecture frontier, with explicit external/reference data mode and claim boundary.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable empirical case study evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Empirical Case Study evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"External Validation","engineering_question":"When does the cheapest design fail reliability confidence despite attractive nominal KPIs?","method":"EPA refresh, empirical benchmark gap analysis and model-vs-observation claim checks","evidence":"Evidence object: EPA refresh, empirical benchmark gap analysis and model-vs-observation claim checks, with explicit external/reference data mode and claim boundary.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable external validation evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the External Validation evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Data Refresh","engineering_question":"Is the current analytical state fresh enough to support the vehicle architecture / requirement release decision?","method":"Versioned EPA data refresh, checksum, schema drift and evidence-promotion workflow","evidence":"Evidence object: Versioned EPA data refresh, checksum, schema drift and evidence-promotion workflow, with explicit external/reference data mode and claim boundary.","required_inputs":["vehicle architecture","validated source/provenance","current constraints/state"],"decision_output":"Auditable data refresh evidence for architecture release / HOLD","operator_action":"Vehicle Systems Engineer reviews the Data Refresh evidence, drills into the responsible vehicle architecture, then approves, holds or escalates the architecture release / HOLD."},{"workspace":"Architecture Campaign","engineering_question":"Which architecture remains confidence-certified across model/scenario realizations?","method":"Multi-seed neural-surrogate + uncertainty scenarios + ARCH-SHIELD selection","evidence":"Architecture selection stability, reliability lower bound, cost and surrogate error","required_inputs":["vehicle architecture / requirement set","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable architecture campaign evidence for vehicle architecture release / HOLD","operator_action":"Advance only an architecture whose confidence certification is stable."},{"workspace":"Requirement Margin","engineering_question":"How much reliability headroom exists above each hard requirement target?","method":"Finite-sample reliability lower-bound margin aggregated across verification campaigns","evidence":"Minimum/mean LCB margin, target gap and selected architecture","required_inputs":["vehicle architecture / requirement set","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable requirement margin evidence for vehicle architecture release / HOLD","operator_action":"HOLD release if confidence margin is too small for design maturity."},{"workspace":"Surrogate Verification","engineering_question":"Where can neural surrogate error change the architecture choice?","method":"Cross-seed normalized RMSE and model-disagreement review before exact-physics escalation","evidence":"Range/acceleration/cost RMSE, disagreement and selected design stability","required_inputs":["vehicle architecture / requirement set","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable surrogate verification evidence for vehicle architecture release / HOLD","operator_action":"Escalate high-disagreement regions to exact physics before release."},{"workspace":"Cost\u2013Confidence Frontier","engineering_question":"What manufacturing-cost premium buys meaningful reliability confidence?","method":"Robustness premium compared with finite-sample reliability margin and feasibility","evidence":"Selected cost, cheapest-design gap, reliability margin and robust-feasibility evidence","required_inputs":["vehicle architecture / requirement set","validated empirical/reference evidence","current decision constraints"],"decision_ alidated public source/provenance","raw/canonical hash and schema state","current model/algorithm readiness"],"decision_output":"Auditable vehicle benchmark backbone evidence","operator_action":"Vehicle Systems Engineer requires exact physics verification whenever benchmark error exceeds the release band."}];function evPick(i){let w=EVW[i];document.getElementById('ev-title').textContent=w.workspace;document.getElementById('ev-question').textContent=w.engineering_question;document.getElementById('ev-method').textContent=w.method;document.getElementById('ev-action').textContent=w.operator_action;document.querySelectorAll('#ev-dock button').forEach((b,j)=>b.classList.toggle('on',i===j))}EVW.forEach((w,i)=>{let b=document.createElement('button');b.dataset.workspace=w.workspace;b.textContent=(i+1)+'\n'+w.workspace;b.onclick=()=>evPick(i);document.getElementById('ev-dock').appendChild(b)});evPick(0);async function evj(u){return (await fetch(u)).json()}Promise.all([evj('/api/tenx/decision'),evj('/api/ml/lifecycle'),evj('/api/agent/run'),evj('/api/airlines15x/empirical')]).then(([d,l,a,e])=>{document.getElementById('ev-source').textContent='data: '+((e.public_data_backbone&&[e.public_data_backbone.dataset_state,(e.public_data_backbone.primary_files?.[0]?.rows??'no-rows')+' rows',(e.public_data_backbone.primary_files?.[0]?.features??'')+' fields'].filter(Boolean).join(' | '))||e.data_mode||e.source_mode||'reference');let c=d.decision||{};document.getElementById('ev-arch').textContent=c.design?.name||c.name||'selected';document.getElementById('ev-lcb').textContent=Number(c.reliability_lcb||0).toFixed(3);document.getElementById('ev-model').textContent=l.registry_state;document.getElementById('ev-state').textContent=a.decision_state;document.getElementById('ev-mode').textContent=a.decision_state;document.getElementById('ev-plan').innerHTML=a.chosen_tool_sequence.map(x=>'<div>'+x+'</div>').join('');document.getElementById('ev-challenge').textContent=JSON.stringify(a.challenge,nu
